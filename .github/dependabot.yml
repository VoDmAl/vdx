# Version updates once a month, one pull request per ecosystem — CI checks it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: monthly
    groups:
      cli:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
