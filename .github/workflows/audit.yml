name: Audit

# An advisory appears without a change in the repo, so the audit runs on a
# schedule rather than on push: a push is not refused for someone else's news.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: npm audit (runtime dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Audit
        run: mise run check:code:security
