name: CI

on:
  push:
    # vdx-gate/<branch>: vdx push leaves a commit there for CI, and the branch
    # takes it once the checks pass (docs/tasks/hosting-extension, DL #10).
    branches: [main, 'vdx-gate/**']
  pull_request:

jobs:
  test:
    name: cli (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    # The vocabulary's tasks, through its runner — what a person and an agent
    # run here. mise.toml pins node 22; the matrix widens it.
    env:
      MISE_NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install cli dependencies
        working-directory: cli
        run: npm ci
      - name: Check
        run: mise run check
      - name: Test
        run: mise run test
      - name: Packed package
        run: mise run test:e2e
