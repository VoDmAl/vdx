name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: cli (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    # The vocabulary's tasks, through its runner — what a person and an agent
    # run here. mise.toml pins node 20; the matrix widens it.
    env:
      MISE_NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Install cli dependencies
        working-directory: cli
        run: npm ci
      - name: Check
        run: mise run check
      - name: Test
        run: mise run test
