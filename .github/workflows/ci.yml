name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install cli dependencies
        working-directory: cli
        run: npm ci
      - name: Typecheck
        working-directory: cli
        run: npm test
