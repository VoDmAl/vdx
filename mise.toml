# vdx сам — meta-репо (документация + nested CLI в `cli/`).
# Корневой стек не определяется детектором (см. O28 в docs/decisions.md),
# поэтому mise.toml написан руками, без `vdx init`.
# Используем bare-глаголы как фасад к командам внутри cli/.

[tools]
node = "20"

[tasks.build]
description = "Install CLI dependencies"
run = "npm --prefix cli install"

[tasks.test]
description = "Run the CLI unit tests"
run = "npm --prefix cli test"

[tasks."test:smoke"]
description = "Run smoke audit on the three calibration projects (local paths; not in CI)"
run = "bash cli/smoke.sh"

[tasks.check]
description = "Typecheck the CLI sources and check their formatting"
run = "npm --prefix cli run check"

[tasks.fix]
description = "Format the CLI sources"
run = "npm --prefix cli run fix"

[vdx]
schema_version = "0.2"
baseline = "github.com/VoDmAl/vdx-rubric-vodmal@v1.4.2"
stack = "meta"
verbs = ["build", "test", "check", "fix"]
