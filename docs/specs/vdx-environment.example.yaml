# vdx-environment.yaml — personal environment profile (vodmal)
#
# The person-and-machine half of the vodmal set; vdx-rubric.yaml is the
# project half. Read by `vdx ai` to start an agent in a project, by
# `vdx doctor` for the personal hooks (git.hooks), and by `vdx move` (move.after).
#
# Never bundled into vdx — which agent runs, and with which permissions, is
# a personal choice. Point vdx at this file with $VDX_ENVIRONMENT or a
# ~/.vdx-environment.yaml symlink.
#
# Format: https://github.com/VoDmAl/vdx/blob/main/docs/specs/environment-format.md

schema_version: "0.1"

metadata:
  name: vdx-environment-vodmal
  version: "1.9.0"
  owner: vodmal
  description: "How vodmal runs an agent in a project"

agent:
  command: claude
  args: [--dangerously-skip-permissions]
  resume_args: [--continue]
  # The project's mail session (vdx ai --intercom, vdx 0.36+) starts with this
  # prompt: the inbox is its work — each letter taken, handled, answered —
  # and then it ends itself (vdx ai --close). vdx puts it right after the
  # command: the channel flag below takes a list and would swallow it.
  intercom_args: ["/vdm:intercom check"]
  when:
    # echelon sends its consumers' agents Claude Code channel events: mail
    # while the project's mail window is open (mail.watch), and to every
    # consumer "the project's slice is complete". A session started without
    # the flag drops them silently. Every echelon consumer has
    # signals/sources.yaml; echelon serves no project without one. The rule
    # wakes the agent, so a focused session (vdx ai --focused) leaves it out.
    - id: echelon-channel
      description: "echelon consumer (signals/sources.yaml): echelon wakes the agent over the plugin:echelon@echelon channel"
      if:
        has_file: {path: signals/sources.yaml}
      args: [--dangerously-load-development-channels, plugin:echelon@echelon]
      wakes: true
      confirm:
        # Shown on every start with this flag, --continue included; the
        # cursor rests on "1. I am using this for local development".
        - screen: "Loading development channels"
          keys: [Enter]

session:
  multiplexer: tmux          # tmux | none; without tmux installed, runs in this terminal
  name: "{project}@{host}"   # {host} = $VDX_HOST, else the short hostname
  # {project}: `[_.vdx] name` (or the older `[vdx]`) in the project's mise.toml, else the first name the
  # intercom directory (vdm plugin) keeps for the repo, else the repo name.
  project_names:
    - file: "~/.claude/vdm/intercom/_registry/{repo}.json"
      jsonpath: names.0
  # Where a project's agent may run. Before a start vdx asks the others over ssh
  # what runs there: a running conversation is continued on its machine, and a
  # new one while an agent of the project runs elsewhere starts after a yes.
  machines: [lft, m3]
  # When a session cannot read ~/Downloads, ~/Desktop or ~/Documents, vdx ai
  # says so before the start and shows this. On these machines nas-info keeps
  # the tmux server: its run heals the server while no session runs, and
  # offers a restart (which closes every session) otherwise.
  folders_fix: "~/nas-info/gather-and-send-info.sh in a plain terminal, not under tmux"

git:
  # A repo without its own author makes git refuse to commit (user.useConfigOnly);
  # vdx ai proposes one from the authors of the repos in these directories.
  author_pool:
    - "~/AI Projects"
    - "~/PhpstormProjects"
    - "~/PhpstormProjects/git.vorobyev.name"
  # Repos on these hosts are the owner's alone, and gitolite mirrors some of them
  # to GitHub (its post-update hook: `git push --mirror` to VoDmAl/<repo> or
  # FriendsOfVoDmAl/<repo>). Claude Code's memory goes under git only where nobody
  # but the owner reads every place a commit reaches (vdx 0.38+): the host here,
  # and each mirror — absent, or private with nobody else. Anyone else's repo —
  # work, someone else's, public, a public mirror — keeps the path in
  # .claude/settings.local.json and the memory out of git; a project without
  # origin is personal anyway.
  personal_hosts:
    - host: git.vorobyev.name
      mirrors: ["github.com/VoDmAl/{repo}", "github.com/FriendsOfVoDmAl/{repo}"]
  # Personal hooks: the owner's gates in every repository on the machine. They
  # live in git's user config (hook.<name>.*, Git 2.54), not in each repo, where
  # they fought the repo's own hook framework for one slot. `vdx doctor` checks
  # them, `vdx doctor --fix` writes them into ~/.gitconfig; a repo that must
  # not run one sets hook.<name>.enabled=false locally. Older git skips these
  # keys without a word — doctor says so.
  hooks:
    # The assistant's hooks hold the crystal invariant; this catches a workitem
    # flipped to status: done with open items from outside the assistant (an
    # IDE). Fail-open, silent in a repo without crystals. The marketplace clone
    # is unversioned and updated with the plugin.
    - name: vdm-crystal
      description: "vdm: a crystal set to status: done with open items does not get committed"
      event: pre-commit
      command: '"$HOME/.claude/plugins/marketplaces/vodmal/plugins/vdm-git/scripts/crystal-precommit-check.sh"'
      when_exists: "~/.claude/plugins/marketplaces/vodmal/plugins/vdm-git/scripts/crystal-precommit-check.sh"
    # echelon's guard. No arguments: it asks `bin/echelon guard args` whose
    # repo this is — echelon itself, a consumer (with the exceptions from its
    # guard.allow), or neither, and then it passes. Lives in the echelon clone.
    - name: echelon-guard
      description: "echelon: raw data of other systems and collection credentials do not get committed"
      event: pre-commit
      command: '"$HOME/AI Projects/echelon/plugin/scripts/check-raw-staged.sh"'
      when_exists: "~/AI Projects/echelon/plugin/scripts/check-raw-staged.sh"
    # vdx's guard of Claude Code's memory: a commit that stages .claude/memory/
    # goes only where nobody but the owner reads every place it reaches (origin,
    # the mirrors above; GitHub asked with gh's token, no answer — refused). The
    # notes are not read. Other commits do not start vdx.
    - name: vdx-memory
      description: "vdx: Claude Code's memory goes into a commit only where nobody but you reads"
      event: pre-commit
      command: 'if git diff --cached --name-only -- .claude/memory | grep -q .; then vdx doctor --staged; fi'

# What `vdx move` (vdx 0.40+) runs on this machine once a project's folder has
# moved, with VDX_MOVE_FROM and VDX_MOVE_TO set: tools that keep the project's
# path in their own files. Without the path, the entry is skipped.
move:
  after:
    # echelon's consumers.yaml and mcp.yaml name projects by path (`echelon
    # moved`: only `path:` lines, safe to repeat). Its checkout comes from the
    # intercom directory, not from here: echelon may move too.
    - name: echelon
      description: "echelon: the project's path: lines in consumers.yaml and mcp.yaml follow the folder"
      command: '"$("$HOME/.claude/plugins/marketplaces/vodmal/plugins/vdm/scripts/intercom.sh" role access-layer --path)/bin/echelon" moved "$VDX_MOVE_FROM" "$VDX_MOVE_TO"'
      when_exists: "~/.claude/plugins/marketplaces/vodmal/plugins/vdm/scripts/intercom.sh"
