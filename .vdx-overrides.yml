schema_version: "0.2"

# vdx is a meta-repo (docs + nested CLI in cli/). The axes below are
# defined by the canonical rubric but do not apply to projects of this
# class — they describe deployable services with shared infra, runtime
# secrets, a running process to watch and service dependencies to stand in
# for, none of which vdx has. Suppression is permanent, not time-boxed,
# because the project class won't change. The rubric has no applicability
# condition for these axes yet (docs/tasks/vdx-dogfooding, Sidetrack #2).

overrides:
  - axis: secrets-config
    suppress: true
    reason: "vdx is a CLI/docs repo with no runtime env configuration; the only optional variable is VDX_RUBRIC, documented in cli/README.md"

  - axis: shared-infra
    suppress: true
    reason: "vdx is not a deployable service and does not consume a shared reverse proxy or container network — the axis describes a class vdx is not in"

  - axis: shared-infra-drift
    suppress: true
    reason: "no misc/traefik-global directory exists because shared-infra itself does not apply (see above)"

  - axis: observability
    suppress: true
    reason: "vdx is a CLI that runs in the user's terminal and exits — no long-running process to log from or to report errors to Sentry; it reports to stderr and the exit code"

  - axis: mock-infra
    suppress: true
    reason: "the CLI itself makes no HTTP calls (git, npm and ssh it runs as commands) and has no service dependencies to mock or a production config to keep mocks out of; tests run it on fixture directories and temporary repos"
